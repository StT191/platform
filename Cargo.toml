[workspace.package]
version = "1.7.0"
authors = ["Stefan Tammer <st.tammer@gmail.com>"]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace]
members = ["rel_path"]


[package]
name = "platform"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "platform"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }


[features]
default = ["conflate_resizes"]
timeout = []
async_timeout = []
frame_pacing = []
futures = ["rapidhash"]
device_events = []
auto_wake_lock = ["wake_lock"]
conflate_resizes = []
wake_lock = ["dep:nosleep", "web-sys/Navigator", "web-sys/WakeLock", "web-sys/WakeLockType", "web-sys/WakeLockSentinel"]
touches = ["dep:glam"]
rapidhash = ["dep:rapidhash"]
rng = ["dep:rand", "dep:rapidrand"]
icon_loader = ["dep:icon-loader", "dep:resvg"]
web_clipboard = ["web-sys/Clipboard", "web-sys/ClipboardEvent", "web-sys/DataTransfer"]
directories = ["dep:robius-directories"]
storage = ["directories", "web-sys/Storage"]


[dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
log = { version = "0.4", features = ["std"] }
anyhow = "1"
derive_more = { version = "2", features = ["debug"] }
web-time = "1"

rel_path = { path = "rel_path" }

rapidhash = { version = "4", default-features = false, features = ["std", "unsafe"], optional = true }
rapidrand = { version = "0.1", default-features = false, features = ["rand"], optional = true }
rand = { version = "0.10", default-features = false, optional = true }
glam = { version = "0.34", default-features = false, features = ["std"], optional = true }


[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "1"
robius-directories = { version = "6", optional = true }


[target.'cfg(not(any(target_family = "wasm", target_os = "android")))'.dependencies]
simple_logger = "5"
nosleep = { version = "0.2", optional = true }


[target.'cfg(target_os = "linux")'.dependencies]
icon-loader = { version = "0.4", optional = true }
resvg = { version = "0.48", optional = true }


[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
js-sys = { version = "0.3" }
console_error_panic_hook = "0.1"
console_log = "1"


[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
jni = "0.22"


[dev-dependencies]
softbuffer = "0.4.8"
